<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create Account | Piyush Rajbhar">

    <title>Create Account | Piyush Rajbhar</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">

    <div class="login-bg"></div>

    <div class="login-particles"></div>


    <a href="index.html" class="back-home">
        ← Back to Portfolio
    </a>


    <main class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">
                P<span>.</span>
            </div>


            <!-- HEADER -->

            <div class="login-header">

                <h1>Create Account</h1>

                <p>
                    Create your secure account
                </p>

            </div>


            <!-- SIGNUP FORM -->

            <form id="signupForm">


                <!-- EMAIL -->

                <div class="login-input">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span>✉</span>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="login-input">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="showSignupPassword"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="login-input">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <span>🔒</span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                    id="signupBtn"
                >

                    <span id="signupBtnText">
                        Create Account
                    </span>

                </button>


                <!-- MESSAGE -->

                <p
                    id="signupMessage"
                    class="login-message"
                ></p>


            </form>


            <!-- LOGIN -->

            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>


        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- MAIN JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
